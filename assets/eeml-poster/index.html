<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Perceptually Controversial Latents — EEML Poster</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      background: transparent;
      overflow: hidden; touch-action: none;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #stage {
      width: 100%; height: 100%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .poster {
      display: block;
      width: 100%; height: 100%;
      max-width: 100%; max-height: 100%;
      flex: 0 0 auto;
      aspect-ratio: 2383.94 / 3370.39;
      object-fit: contain;
      background: #fff;
      transform-origin: center center;
      will-change: transform;
      cursor: zoom-in;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img class="poster" id="poster-img" src="poster.png" alt="Perceptually Controversial Latents research poster" draggable="false">

  </div>

  <script>
    const img = document.getElementById('poster-img');
    const stage = document.getElementById('stage');

    function zoomParent(kind, value) {
      if (window.parent !== window && typeof window.parent.eemlBoxZoom === 'function') {
        window.parent.eemlBoxZoom(kind, value);
      }
    }

    // Forward gestures to the parent so the complete box zooms as one object.
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomParent('wheel', e.deltaY);
    }, { passive: false });

    let pinchStartDist = null;
    function dist(t0, t1){
      return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    }
    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = dist(e.touches[0], e.touches[1]);
      }
    }, { passive: false });
    stage.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2 && pinchStartDist) {
        const d = dist(e.touches[0], e.touches[1]);
        zoomParent('pinch', d / pinchStartDist);
        pinchStartDist = d;
      }
    }, { passive: false });
    stage.addEventListener('touchend', () => { pinchStartDist = null; });

    img.addEventListener('dblclick', () => {
      zoomParent('reset');
    });
  </script>
</body>
</html>
